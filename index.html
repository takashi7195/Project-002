<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日の3連単予想</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>今日の3連単予想</h1>
        <div id="forecast-area">
            <p>予想ボタンを押してください</p>
        </div>
        <div class="controls">
            <button id="predict-btn">3連単を予想する</button>
            <button id="reset-btn">リセット</button>
        </div>
        <p>予想回数: <span id="count">0</span></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
